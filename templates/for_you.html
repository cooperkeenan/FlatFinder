{% extends 'base.html' %}

{% block title %}For You - Flat Finder{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='for_you.css') }}">
{% endblock %}

{% block content %}
<div class="for-you-page">
    <!-- Container where the property card will be rendered -->
    <div id="property-container"></div>

    <!-- Action buttons -->
    <div class="action-buttons">
        <button class="dislike-btn">✖</button>
        <button class="like-btn">❤</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
  <!-- Embed properties JSON from the server into a JS variable -->
  <script>
      const properties = {{ properties | tojson }};
  </script>
  <!-- Load the external JavaScript file -->
  <script src="{{ url_for('static', filename='js/for_you.js') }}"></script>
{% endblock %}
